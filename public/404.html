<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Marino Valerie</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --cream: #f9f6ed;
        --brown: #3c2118;
        --yellow: #fcce64;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--cream);
        color: var(--brown);
        font-family: "DM Sans", Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 0.9;
        margin-bottom: 24px;
      }
      a {
        display: inline-flex;
        background: var(--yellow);
        color: var(--brown);
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        border: 1.5px solid var(--brown);
      }
    </style>
  </head>
  <body>
    <main>
      <p>✦ 404</p>
      <h1>This page drifted off</h1>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
